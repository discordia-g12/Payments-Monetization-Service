name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Todavía sin tests (tests/ está vacío): por ahora solo se valida y publica la imagen.
jobs:
  docker:
    # PR: construye la imagen para validar el Dockerfile. Push a main/develop: además la publica en GHCR
    # con el SHA del commit (lo que se despliega) y el nombre de la rama. Sin "latest".
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/discordia-g12/payments-service
      PUSH: ${{ github.event_name == 'push' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Opcional: evita el límite de descargas anónimas de Docker Hub (imágenes base)
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build (and push on main/develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
