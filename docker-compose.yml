services:
  payments_api:
    build: .
    container_name: payments-api
    ports:
      - "8003:8000" # el mismo puerto que publica en producción
    volumes:
      - .:/app
    # Solo en local: recarga al editar (la imagen de producción corre sin --reload)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@payments_db:5432/${POSTGRES_DB:-payments_db}
    depends_on:
      payments_db:
        condition: service_healthy

  payments_db:
    image: postgres:15-alpine
    container_name: payments-db
    ports:
      - "5435:5432" # desde el host: uvicorn, pytest y psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payments_db}
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payments_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payments_db_data:
